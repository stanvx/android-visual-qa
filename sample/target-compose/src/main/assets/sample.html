<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VQA Sample Page</title>
    <style>
        body { font-family: sans-serif; padding: 16px; }
        button { margin: 8px 0; padding: 8px 16px; font-size: 16px; }
        input { margin: 8px 0; padding: 8px; font-size: 16px; display: block; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <h1>Sample Page</h1>
    <p>This is a static HTML page loaded in a WebView.</p>
    <button id="btn-1" onclick="alert('Button 1 clicked')">Button 1</button>
    <button id="btn-2" onclick="alert('Button 2 clicked')">Button 2</button>
    <button id="btn-3" onclick="alert('Button 3 clicked')">Button 3</button>
    <input id="input-1" type="text" placeholder="Text input 1">
    <input id="input-2" type="text" placeholder="Text input 2">
</body>
</html>
